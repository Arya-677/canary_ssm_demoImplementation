      arrival_rate_rps: 80
      work_core_seconds: 0.05
      queue_limit: 300
      baseline_memory_mb: 32
      temporary_mb_per_request: 0.25
      initial_retained_memory_mb: 0
    traffic: []
    shared_jitter: 0.05
    host_baseline_memory_mb: 32
    max_arrivals_per_service_tick: 100000
    trace_max_rows: 20000
    paired_exogenous: false
    health_policy:
      policy_id: resource-health-dev-v1
      window_seconds: 10
      minimum_span_seconds: 5
      minimum_samples: 3
      minimum_processed: 20
      growth_mb_per_request: 0.05
      growth_mb_per_second: 0.5
      pressure_fraction: 0.8
  demo: true
  telemetry:
    enabled: true
    delay_min_ticks: 0
    delay_max_ticks: 0
    duplicate_probability: 0
    missing_probability: 0
    missing_window_probability: 0
    drop_windows: []
    late_windows: []
    late_delay_ticks: 120
    decision_delay_seconds: 0
    minimum_coverage: 0.8
    max_records: 50000
    max_windows: 1000
