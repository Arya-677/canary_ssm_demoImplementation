# V3 combined scenario set for robustness evaluation (Phase 5 / WP-5.1 / Addendum F5).
# Combines regression_recovery with environmental and observational stressors.
version: combined-scen-v1.0
base: {sd_host: 0.02}
scenarios:
  - {name: regression_plus_step,          regime: step,  overrides: {n_affected: 3, effect_pct: 3.5, duration: 45, decay_len: 15, workload_step: 0.3365}}
  - {name: regression_plus_heavytail,     regime: plain, overrides: {n_affected: 3, effect_pct: 3.5, duration: 45, decay_len: 15, heavy_tail_df: 3.0}}
  - {name: regression_plus_missing,       regime: plain, overrides: {n_affected: 3, effect_pct: 3.5, duration: 45, decay_len: 15, missing_rate: 0.20}}
  - {name: regression_plus_contamination, regime: plain, overrides: {n_affected: 3, effect_pct: 3.5, duration: 45, decay_len: 15, contam_frac: 0.20}}
  - {name: regression_plus_labelerror,    regime: plain, overrides: {affected_mode: class0, effect_pct: 3.5, duration: 45, decay_len: 15, label_error: 0.30}}
