# LEGACY MIXTURE CONFIG (Revision 1 baseline only) — DO NOT USE FOR CALIBRATION.
# Kept only for reproducing v0.1-first-full-run; mixes S1_step nulls into the plain mixture (WP-A1 fixes I-01).
regime: legacy_mixture_with_step
sim: {sd_host: 0.02}
roles:
  dev:             {pairs: 300}    # 300 null + 300 harmed (paired)
  calibration:     {pairs: 500}    # 500 nulls
  null_validation: {pairs: 500}    # 500 nulls
  test:            {pairs: 500}    # 500 null + 500 harmed (paired)
  smoke:           {pairs: 12}
families:
  - {name: S1_sparse,        weight: 0.20, overrides: {n_affected: 3,  effect_pct: 3.0, duration: 45}}
  - {name: S2_class_wide,    weight: 0.20, overrides: {affected_mode: class0, effect_pct: 3.0, duration: 45}}
  - {name: S3_broad,         weight: 0.10, overrides: {n_affected: 10, effect_pct: 3.0, duration: 45}}
  - {name: S4_weak_sparse,   weight: 0.10, overrides: {n_affected: 3,  effect_pct: 2.5, duration: 45}}
  - {name: S5_label_errors,  weight: 0.10, overrides: {affected_mode: class0, effect_pct: 3.0, duration: 45, label_error: 0.3}}
  - {name: S1_step,          weight: 0.15, overrides: {n_affected: 3,  effect_pct: 3.0, duration: 45, workload_step: 0.3365}}
  - {name: single_canary,    weight: 0.10, overrides: {n_affected: 1,  effect_pct: 4.0, duration: 45}}
  - {name: transient,        weight: 0.05, overrides: {n_affected: 3,  effect_pct: 3.0, duration: 10}}  # <15 min: challenge set
