[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canary_ssm"
version = "0.2.0"
description = "Hierarchical state-space canary regression detection: simulator, baselines, filters, evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14", "hypothesis>=6.100,<6.125"]
report = ["tabulate>=0.9"]

[project.scripts]
canary-ssm = "canary_ssm.cli:main"

[tool.setuptools]
packages = ["canary_ssm", "canary_ssm.studies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks slow reproduction tests"]
